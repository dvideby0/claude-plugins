[package]
name = "sdlc-scan-core"
version = "0.1.0"
edition = "2021"
description = "Parallel repository walking and parsing for the SDLC engine."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
ignore = "0.4"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
scip = "0.9.0"
protobuf = "3.7"
url = "2.5"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
streaming-iterator = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
