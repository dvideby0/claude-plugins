name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The docs are a hub-and-leaf tree that only discipline keeps honest. This
  # needs nothing but a checkout, so it fails in seconds rather than after the
  # native matrix.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check documentation structure
        run: node scripts/check-docs.mjs

  # The scan core is native, so it is built per platform and published as a
  # prebuilt artifact. Nobody installing the app should need a Rust toolchain.
  native:
    name: scan-core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # The action installs a minimal profile, which leaves clippy out. It
          # happens to be on every runner image today, so asking for it changes
          # nothing until the day an image drops it and the lint step vanishes
          # into a confusing failure instead of a missing one.
          components: clippy
      # This job invokes the native build explicitly below. Avoid unrelated
      # workspace install hooks (notably Electron downloads) in the Rust matrix.
      - run: npm ci --ignore-scripts
      # The crate's own tests, on every runner in the matrix. The `test` job
      # below covers Linux only, and this crate's behaviour genuinely differs
      # per platform: the freshness key is built from different fields on
      # Windows, and filesystem timestamp granularity differs enough that a
      # test passing on one has already been found failing on another. Every
      # runner here is native, so the host-targeted test build runs.
      - run: cargo test --manifest-path packages/scan-core/Cargo.toml
      # The crate declares `#![deny(clippy::all)]`, which until now nothing
      # checked — so a lint it had already opted into was failing anybody who
      # ran it locally. `--all-targets` because a bare `cargo clippy` never
      # compiles the `cfg(test)` code, so none of it is linted at all; the
      # crate attribute does reach it once it is built. `-D warnings` is for
      # the plain rustc warnings the attribute says nothing about — a dead
      # store shipped from this branch as one.
      - run: cargo clippy --manifest-path packages/scan-core/Cargo.toml --all-targets -- -D warnings
      - run: npm run build -w @sdlc/scan-core -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: scan-core-${{ matrix.target }}
          path: packages/scan-core/*.node
          if-no-files-found: error

  desktop-package:
    name: desktop package (${{ matrix.target }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, platform: mac, arch: arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, platform: mac, arch: x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux, arch: arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: scan-core-${{ matrix.target }}
          path: packages/scan-core
      - run: npm run build -w @sdlc/protocol
      - run: npm run build -w @sdlc/engine
      - run: npm run build -w @sdlc/mcp-bridge
      - run: npm run package:dir -w @sdlc/desktop -- --${{ matrix.platform }} --${{ matrix.arch }}

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path packages/scan-core/Cargo.toml

      - name: install official SCIP golden-test CLI
        env:
          SCIP_ARCHIVE_SHA256: fc2e7273e110be9f35924da1066000183791e8bfdb0391355de6eaaa070fec75
          SCIP_ARCHIVE_URL: https://github.com/scip-code/scip/releases/download/v0.9.0/scip-linux-amd64.tar.gz
        run: |
          curl --fail --silent --show-error --location "$SCIP_ARCHIVE_URL" --output "$RUNNER_TEMP/scip.tar.gz"
          echo "$SCIP_ARCHIVE_SHA256  $RUNNER_TEMP/scip.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scip.tar.gz" -C "$RUNNER_TEMP"

      - name: evaluate code-intelligence providers
        run: npm run eval -w @sdlc/engine -- --json --require-scip-cli --scip-cli "$RUNNER_TEMP/scip"

      - name: test
        run: npm test -w @sdlc/engine

      - name: end to end
        run: |
          node packages/engine/dist/daemon/main.js &
          sleep 3
          node scripts/smoke.mjs

      - name: validate plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict plugins/sdlc
